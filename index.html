<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>XodeOMiD - Professional Developer</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
         :root {
            --neon: #00f5ff;
            --neon2: #ff00ff;
        }
        
        html,
        body {
            height: 100%;
            font-family: "Poppins", sans-serif;
            background: #050510;
            overflow: hidden;
        }
        /* ---------------- CYBER GRID BACKGROUND ---------------- */
        
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: linear-gradient(rgba(0, 255, 255, 0.07) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 255, 255, 0.07) 1px, transparent 1px);
            background-size: 40px 40px;
            animation: gridMove 12s linear infinite;
            z-index: -3;
        }
        
        @keyframes gridMove {
            from {
                transform: translateY(0);
            }
            to {
                transform: translateY(40px);
            }
        }
        /* -------- CINEMATIC NOISE -------- */
        
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            background: url("https://grainy-gradients.vercel.app/noise.svg");
            opacity: 0.08;
            z-index: -2;
            pointer-events: none;
        }
        /* ------------- NEON CURSOR GLOW ------------- */
        
        .cursor-glow {
            position: fixed;
            width: 300px;
            height: 300px;
            background: radial-gradient( circle, rgba(0, 255, 255, 0.25), transparent 60%);
            pointer-events: none;
            z-index: -1;
            transform: translate(-50%, -50%);
            transition: 0.1s;
        }
        /* ------------- FLOATING PARTICLES ------------- */
        
        .particles {
            position: fixed;
            inset: 0;
            overflow: hidden;
            z-index: 0;
        }
        
        .particle {
            position: absolute;
            bottom: -20px;
            width: 6px;
            height: 6px;
            background: white;
            border-radius: 50%;
            opacity: .9;
            animation: rise linear infinite;
            filter: blur(1px);
        }
        
        @keyframes rise {
            from {
                transform: translateY(0);
                opacity: 0;
            }
            10% {
                opacity: 0.8;
            }
            90% {
                opacity: 0.8;
            }
            to {
                transform: translateY(-110vh);
                opacity: 0;
            }
        }
        /* ------------- CARD CONTAINER ------------- */
        
        .container {
            position: relative;
            z-index: 2;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .profile-card {
            /* position: relative; */
            max-width: 430px;
            padding: 48px 40px;
            border-radius: 35px;
            background: rgba(255, 255, 255, .025);
            backdrop-filter: saturate(120%) blur(8px);
            -webkit-backdrop-filter: saturate(120%) blur(8px);
            box-shadow: 0 10px 40px rgba(0, 255, 255, 0.1), inset 0 0 0 1px rgba(255, 255, 255, .055);
            isolation: isolate;
            text-align: center;
        }
        
        .profile-card::before {
            content: "";
            position: absolute;
            inset: -2px;
            border-radius: inherit;
            background: radial-gradient(120px 60px at 20% -10%, rgba(255, 0, 55, .35), transparent 60%), radial-gradient(180px 120px at 110% 120%, rgba(179, 0, 27, .45), transparent 60%);
            filter: blur(16px);
            opacity: .55;
            z-index: -1;
        }
        /* ------------- CONTENT ------------- */
        
        .avatar {
            width: 120px;
            height: 120px;
            margin: 0 auto 20px;
            border-radius: 50%;
            overflow: hidden;
            box-shadow: 0 0 25px var(--neon);
        }
        
        h1 {
            color: white;
            font-size: 2.4rem;
            margin-bottom: 10px;
            text-shadow: 0 0 10px var(--neon);
        }
        
        .subtitle,
        .description,
        footer {
            color: #ccc;
        }
        
        .badge {
            display: inline-block;
            padding: 8px 16px;
            border-radius: 50px;
            margin: 15px 0 20px;
            background: rgba(0, 255, 255, 0.1);
            border: 1px solid var(--neon);
            color: var(--neon);
            font-weight: 600;
        }
        
        .divider {
            width: 60px;
            height: 3px;
            margin: 20px auto;
            background: linear-gradient(90deg, var(--neon), var(--neon2));
        }
        /* -------- SOCIAL BUTTONS -------- */
        
        .social-links {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 25px;
        }
        
        .social-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 14px;
            border-radius: 15px;
            text-decoration: none;
            color: white;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 255, 255, 0.3);
            transition: 0.3s;
        }
        
        .social-btn:hover {
            transform: translateY(-4px);
            box-shadow: 0 0 20px var(--neon);
            border-color: var(--neon);
        }
        
        .social-btn img {
            width: 20px;
            height: 20px;
            filter: brightness(10);
        }
        /* -------- CTA -------- */
        
        .cta-button {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 15px;
            font-weight: 700;
            cursor: pointer;
            color: white;
            background: linear-gradient(90deg, var(--neon), var(--neon2));
            box-shadow: 0 0 25px var(--neon);
            transition: 0.3s;
        }
        
        .cta-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 40px var(--neon);
        }
        /* -------- MOBILE -------- */
        
        @media (max-width: 480px) {
            .profile-card {
                padding: 35px 20px;
            }
            .social-links {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <script>
        /* Neon Cursor */
        const glow = document.querySelector(".cursor-glow");
        document.addEventListener("mousemove", (e) => {
            glow.style.left = e.clientX + "px";
            glow.style.top = e.clientY + "px";
        });

        /* Random Particles */
        const container = document.getElementById("particles");

        function createParticle() {
            const p = document.createElement("div");
            p.className = "particle";
            p.style.left = Math.random() * 100 + "%";
            p.style.animationDuration = 8 + Math.random() * 8 + "s";
            p.style.opacity = Math.random();
            p.style.filter = "blur(" + Math.random() * 2 + "px)";
            container.appendChild(p);
            setTimeout(() => p.remove(), 16000);
        }

        setInterval(createParticle, 300);
    </script>
</body>

</html>
